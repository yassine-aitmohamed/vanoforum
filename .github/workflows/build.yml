# Runs when a contribution is merged into main: rebuilds the pages, the search index and the PDF sheets,
# and commits them, so that a contributor only has to send the Markdown file.
name: Build the site

on:
  push:
    branches: [main]
    paths: ['guides/**/*.md', 'scripts/**', 'assets/css/**', 'assets/js/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown
      - name: Build the pages
        run: python3 scripts/build.py
      - name: Install LaTeX, pandoc and the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended pandoc librsvg2-bin fonts-texgyre fonts-inter
      - name: Build the PDF sheets and the handbook
        continue-on-error: true
        run: python3 scripts/build_pdf.py
      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Rebuild the site"
          git push
      - name: Ask GitHub Pages to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
