<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1147 269" width="1147" height="269" role="img" aria-label="Skimming a paper in five passes"><title>Skimming a paper in five passes</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Skimming a paper in five passes</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Each pass is longer than the last. Stop as soon as you know enough.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Abstract</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Title and abstract. Two</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">minutes.</text><circle cx="279.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="273.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Objectives</text><text x="273.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">End of the introduction</text><text x="273.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">and the figures or main</text><text x="273.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">theorems.</text><circle cx="494.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="488.0" y="