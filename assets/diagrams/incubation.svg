<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="The rhythm of hard problems"><title>The rhythm of hard problems</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">The rhythm of hard problems</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">After Poincaré and Wallas. A break helps only after real preparation.</text><path d="M502.0 197.3Q664.0 219.0 758.0 352.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M653.4 250.9L638.2 247.1L643.0 239.1Z" fill="#4b5563"/><path d="M758.0 367.3Q664.0 501.0 502.0 522.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M640.6 476.9L651.0 465.1L655.8 473.1Z" fill="#4b5563"/><path d="M478.0 522.7Q316.0 501.0 222.0 367.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M326.6 469.1L341.8 472.9L337.0 480.9Z" fill="#4b5563"/><path d="M222.0 352.7Q316.0 219.0 478.0 197.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M339.4 243.1L329.0 254.9L324.2 246.9Z" fill="#4b5563"/><circle cx="490.0" cy="190.0" r="6.5" fill="#2b4fb3"/><text x="490.0" y="127.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Preparation</text><text x="490.0" y="147.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Deep, uninterrupted work</text><text x="490.0" y="164.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">on the problem.</text><circle cx="770.0" cy="360.0" r="6.5" fill="#3fa3dd"/><text x="792.0" y="365.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Incubation</text><text x="792.0" y="385.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">A walk, light tasks,</text><text x="792.0" y="402.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">sleep.</text><circle cx="490.0" cy="530.0" r="6.5" fill="#e07b24"/><text x="490.0" y="560.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Illumination</text><text x="490.0" y="580.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">The idea arrives, often</text><text x="490.0" y="597.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">unexpectedly.</text><circle cx="210.0" cy="360.0" r="6.5" fill="#2b4fb3"/><text x="188.0" y="365.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Verification</text><text x="188.0" y="385.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Check every step</text><text x="188.0" y="402.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">carefully.</text></svg>