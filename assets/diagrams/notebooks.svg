<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 252" width="1012" height="252" role="img" aria-label="A notebook practice"><title>A notebook practice</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">A notebook practice</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Think on paper, then keep a clean record of what is known.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Waste book</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Fast, dated, messy: attempts</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">and ideas.</text><circle cx="299.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="293.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Tags</text><text x="293.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Conjecture, example,</text><text x="293.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">verified, refuted.</text><circle cx="534.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="528.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Ledger</text><text x="528.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Weekly, clean statements of</text><text x="528.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">what is known.</text><circle cx="769.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="763.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Index</text><text x="763.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">A monthly table of contents.</text><path d="M78.0 128.0Q181.5 90.4 285.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M189.0 109.2L174.0 113.9L174.0 104.5Z" fill="#4b5563"/><path d="M313.0 128.0Q416.5 90.4 520.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M424.0 109.2L409.0 113.9L409.0 104.5Z" fill="#4b5563"/><path d="M548.0 128.0Q651.5 90.4 755.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M659.0 109.2L644.0 113.9L644.0 104.5Z" fill="#4b5563"/></svg>