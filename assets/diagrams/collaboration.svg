<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 252" width="1052" height="252" role="img" aria-label="A healthy collaboration"><title>A healthy collaboration</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">A healthy collaboration</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Most conflicts come from things never said. Discuss them early.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Start</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">A shared note: the question,</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">first tasks, next meeting.</text><circle cx="309.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="303.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Work</text><text x="303.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">One repository, regular calls,</text><text x="303.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">written decisions.</text><circle cx="554.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="548.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Authorship</text><text x="548.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Agree on the convention.</text><text x="548.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Alphabetical in mathematics.</text><circle cx="799.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="793.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Submit</text><text x="793.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Choose the journal and the</text><text x="793.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">preprint date together.</text><path d="M78.0 128.0Q186.5 88.8 295.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M194.0 108.4L179.0 113.1L179.0 103.8Z" fill="#4b5563"/><path d="M323.0 128.0Q431.5 88.8 540.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M439.0 108.4L424.0 113.1L424.0 103.8Z" fill="#4b5563"/><path d="M568.0 128.0Q676.5 88.8 785.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M684.0 108.4L669.0 113.1L669.0 103.8Z" fill="#4b5563"/></svg>