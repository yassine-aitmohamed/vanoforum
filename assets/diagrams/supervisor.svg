<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" role="img" aria-label="Choosing a supervisor"><title>Choosing a supervisor</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Choosing a supervisor</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">The topic matters, but the person matters more. Check every point before accepting.</text><path d="M533.2 194.7Q673.2 183.8 775.3 280.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M670.8 213.2L655.1 212.5L658.2 203.8Z" fill="#4b5563"/><path d="M788.5 299.0Q826.5 380.0 788.5 461.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M807.5 387.5L802.8 372.5L812.1 372.5Z" fill="#4b5563"/><path d="M775.3 479.7Q673.2 576.2 533.2 565.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M656.7 551.8L669.3 542.5L672.4 551.2Z" fill="#4b5563"/><path d="M506.8 565.3Q366.8 576.2 264.7 479.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M369.2 546.8L384.9 547.5L381.8 556.2Z" fill="#4b5563"/><path d="M251.5 461.0Q213.5 380.0 251.5 299.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M232.5 372.5L237.2 387.5L227.9 387.5Z" fill="#4b5563"/><path d="M264.7 280.3Q366.8 183.8 506.8 194.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M383.3 208.2L370.7 217.5L367.6 208.8Z" fill="#4b5563"/><circle cx="520.0" cy="190.0" r="6.5" fill="#2b4fb3"/><text x="520.0" y="127.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Research fit</text><text x="520.0" y="147.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Papers you want to read</text><text x="520.0" y="164.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">and could build on.</text><circle cx="788.5" cy="285.0" r="6.5" fill="#3fa3dd"/><text x="810.5" y="290.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Availability</text><text x="810.5" y="310.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">How often students meet</text><text x="810.5" y="327.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">the supervisor.</text><circle cx="788.5" cy="475.0" r="6.5" fill="#e07b24"/><text x="810.5" y="480.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Group</text><text x="810.5" y="500.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Other students, postdocs,</text><text x="810.5" y="517.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">a seminar to learn in.</text><circle cx="520.0" cy="570.0" r="6.5" fill="#2b4fb3"/><text x="520.0" y="600.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Track record</text><text x="520.0" y="620.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Where former students went</text><text x="520.0" y="637.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">after the PhD.</text><circle cx="251.5" cy="475.0" r="6.5" fill="#3fa3dd"/><text x="229.5" y="480.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Style</text><text x="229.5" y="500.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Close guidance or</text><text x="229.5" y="517.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">independence, and what you</text><text x="229.5" y="534.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">need.</text><circle cx="251.5" cy="285.0" r="6.5" fill="#e07b24"/><text x="229.5" y="290.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Funding</text><text x="229.5" y="310.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Duration, salary,</text><text x="229.5" y="327.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">teaching, travel money.</text></svg>