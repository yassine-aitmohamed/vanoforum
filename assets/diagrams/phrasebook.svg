<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 252" width="1212" height="252" role="img" aria-label="Phrases by function"><title>Phrases by function</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Phrases by function</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Every part of a paper has its own standard phrases. Adapt them, do not copy them.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Open</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Context, history, and</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">the question.</text><circle cx="254.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="248.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Gap</text><text x="248.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">What is missing and</text><text x="248.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">why it is hard.</text><circle cx="444.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="438.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Announce</text><text x="438.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Main results and</text><text x="438.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">consequences.</text><circle cx="634.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="628.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Compare</text><text x="628.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Earlier work, fairly</text><text x="628.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">and precisely.</text><circle cx="824.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="818.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Prove</text><text x="818.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Reductions, cases,</text><text x="818.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">contradiction.</text><circle cx="1014.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="1008.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Conclude</text><text x="1008.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Open questions and</text><text x="1008.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">next steps.</text><path d="M78.0 128.0Q159.0 97.6 240.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M166.5 112.8L151.5 117.5L151.5 108.1Z" fill="#4b5563"/><path d="M268.0 128.0Q349.0 97.6 430.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M356.5 112.8L341.5 117.5L341.5 108.1Z" fill="#4b5563"/><path d="M458.0 128.0Q539.0 97.6 620.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M546.5 112.8L531.5 117.5L531.5 108.1Z" fill="#4b5563"/><path d="M648.0 128.0Q729.0 97.6 810.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M736.5 112.8L721.5 117.5L721.5 108.1Z" fill="#4b5563"/><path d="M838.0 128.0Q919.0 97.6 1000.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M926.5 112.8L911.5 117.5L911.5 108.1Z" fill="#4b5563"/></svg>