<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640" role="img" aria-label="Keeping up with the literature"><title>Keeping up with the literature</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Keeping up with the literature</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">A loop that costs ten minutes a day.</text><path d="M522.8 195.6Q677.5 195.1 782.5 308.8" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M672.0 226.7L656.4 224.9L660.1 216.4Z" fill="#4b5563"/><path d="M788.7 326.7Q781.1 436.8 693.0 503.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M757.4 432.5L760.4 417.1L768.6 421.5Z" fill="#4b5563"/><path d="M672.3 515.6Q510.0 586.2 347.7 515.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M502.5 550.9L517.5 546.2L517.5 555.5Z" fill="#4b5563"/><path d="M327.0 503.3Q238.9 436.8 231.3 326.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M255.5 419.3L266.7 430.3L258.5 434.7Z" fill="#4b5563"/><path d="M237.5 308.8Q342.5 195.1 497.2 195.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M361.8 220.7L349.9 230.9L346.2 222.4Z" fill="#4b5563"/><circle cx="510.0" cy="190.0" r="6.5" fill="#2b4fb3"/><text x="510.0" y="110.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Alerts</text><text x="510.0" y="130.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">arXiv listings, Scholar</text><text x="510.0" y="147.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">alerts, journal tables of</text><text x="510.0" y="164.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">contents.</text><circle cx="795.3" cy="314.4" r="6.5" fill="#3fa3dd"/><text x="817.3" y="319.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Screen</text><text x="817.3" y="339.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Titles and abstracts. Keep</text><text x="817.3" y="356.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">few.</text><circle cx="686.3" cy="515.6" r="6.5" fill="#e07b24"/><text x="708.3" y="520.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Read</text><text x="708.3" y="540.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Three passes, with a PDF</text><text x="708.3" y="557.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">reader that previews</text><text x="708.3" y="574.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">citations.</text><circle cx="333.7" cy="515.6" r="6.5" fill="#2b4fb3"/><text x="311.7" y="520.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">File</text><text x="311.7" y="540.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Reference manager, BibTeX,</text><text x="311.7" y="557.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">reading sheet.</text><circle cx="224.7" cy="314.4" r="6.5" fill="#3fa3dd"/><text x="202.7" y="319.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Follow</text><text x="202.7" y="339.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Bibliography backward,</text><text x="202.7" y="356.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">citing papers forward.</text></svg>