<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 269" width="1072" height="269" role="img" aria-label="The postdoc market"><title>The postdoc market</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">The postdoc market</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">A yearly calendar. Prepare during the final year of the PhD.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Summer</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Documents, list of positions,</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">letter writers chosen.</text><circle cx="314.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="308.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Autumn</text><text x="308.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Most applications. Many</text><text x="308.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">deadlines in November and</text><text x="308.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">December.</text><circle cx="564.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="558.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Winter</text><text x="558.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Interviews and job talks.</text><text x="558.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">First offers.</text><circle cx="814.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="808.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Spring</text><text x="808.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Offers compared, decisions</text><text x="808.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">made, contract signed.</text><path d="M78.0 128.0Q189.0 88.0 300.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M196.5 108.0L181.5 112.7L181.5 103.3Z" fill="#4b5563"/><path d="M328.0 128.0Q439.0 88.0 550.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M446.5 108.0L431.5 112.7L431.5 103.3Z" fill="#4b5563"/><path d="M578.0 128.0Q689.0 88.0 800.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M696.5 108.0L681.5 112.7L681.5 103.3Z" fill="#4b5563"/></svg>