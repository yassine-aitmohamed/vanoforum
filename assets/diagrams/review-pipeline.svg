<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1147 269" width="1147" height="269" role="img" aria-label="From submission to decision"><title>From submission to decision</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">From submission to decision</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Typical stages. In mathematics, a full review often takes several months. Revisions go back and forth.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Submission</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">PDF, source, a one-page</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">cover letter, suggested</text><text x="58.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">referees.</text><circle cx="279.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="273.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Screening</text><text x="273.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">The editor checks scope</text><text x="273.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">and level. Desk rejections</text><text x="273.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">are common and fast.</text><circle cx="494.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="488.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Referees</text><text x="488.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">The handling editor</text><text x="488.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">invites experts. This</text><text x="488.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">alone can take weeks.</text><circle cx="709.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="703.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Reports</text><text x="703.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Accept, minor or major</text><text x="703.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">revision, or reject.</text><circle cx="924.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="918.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Revision</text><text x="918.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Point-by-point answers,</text><text x="918.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">exact changes, polite</text><text x="918.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">disagreement.</text><path d="M78.0 128.0Q171.5 93.6 265.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M179.0 110.8L164.0 115.5L164.0 106.1Z" fill="#4b5563"/><path d="M293.0 128.0Q386.5 93.6 480.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M394.0 110.8L379.0 115.5L379.0 106.1Z" fill="#4b5563"/><path d="M508.0 128.0Q601.5 93.6 695.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M609.0 110.8L594.0 115.5L594.0 106.1Z" fill="#4b5563"/><path d="M723.0 128.0Q816.5 93.6 910.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M824.0 110.8L809.0 115.5L809.0 106.1Z" fill="#4b5563"/><path d="M910.0 128.0Q816.5 162.4 723.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M809.0 145.2L824.0 140.5L824.0 149.8Z" fill="#4b5563"/></svg>