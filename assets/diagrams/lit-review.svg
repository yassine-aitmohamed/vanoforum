<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640" role="img" aria-label="Building a literature review"><title>Building a literature review</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Building a literature review</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">An argument about a field, not a list of summaries.</text><path d="M522.8 195.6Q677.5 195.1 782.5 308.8" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M672.0 226.7L656.4 224.9L660.1 216.4Z" fill="#4b5563"/><path d="M788.7 326.7Q781.1 436.8 693.0 503.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M757.4 432.5L760.4 417.1L768.6 421.5Z" fill="#4b5563"/><path d="M672.3 515.6Q510.0 586.2 347.7 515.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M502.5 550.9L517.5 546.2L517.5 555.5Z" fill="#4b5563"/><path d="M327.0 503.3Q238.9 436.8 231.3 326.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M255.5 419.3L266.7 430.3L258.5 434.7Z" fill="#4b5563"/><path d="M237.5 308.8Q342.5 195.1 497.2 195.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M361.8 220.7L349.9 230.9L346.2 222.4Z" fill="#4b5563"/><circle cx="510.0" cy="190.0" r="6.5" fill="#2b4fb3"/><text x="510.0" y="127.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Scope</text><text x="510.0" y="147.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Two sentences on what is</text><text x="510.0" y="164.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">in and out.</text><circle cx="795.3" cy="314.4" r="6.5" fill="#3fa3dd"/><text x="817.3" y="319.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Search</text><text x="817.3" y="339.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Backward, forward, recent</text><text x="817.3" y="356.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">preprints.</text><circle cx="686.3" cy="515.6" r="6.5" fill="#e07b24"/><text x="708.3" y="520.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Organise</text><text x="708.3" y="540.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Notes and a comparison</text><text x="708.3" y="557.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">table.</text><circle cx="333.7" cy="515.6" r="6.5" fill="#2b4fb3"/><text x="311.7" y="520.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Structure</text><text x="311.7" y="540.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">By theme, method, or</text><text x="311.7" y="557.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">history.</text><circle cx="224.7" cy="314.4" r="6.5" fill="#3fa3dd"/><text x="202.7" y="319.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Write</text><text x="202.7" y="339.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Compare ideas, end with</text><text x="202.7" y="356.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">gaps.</text></svg>