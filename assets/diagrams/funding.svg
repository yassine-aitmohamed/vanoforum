<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1197 269" width="1197" height="269" role="img" aria-label="Funding a doctorate"><title>Funding a doctorate</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Funding a doctorate</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Never accept an unfunded PhD without a clear plan. Many routes exist.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Funded positions</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Salaried contracts attached</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">to a grant or a doctoral</text><text x="58.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">school.</text><circle cx="289.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="283.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Fellowships</text><text x="283.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">MSCA doctoral networks,</text><text x="283.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">DAAD, national</text><text x="283.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">scholarships.</text><circle cx="514.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="508.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Assistantships</text><text x="508.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Teaching or research</text><text x="508.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">assistant posts in North</text><text x="508.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">America.</text><circle cx="739.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="733.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Home country</text><text x="733.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Government scholarships for</text><text x="733.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">study abroad.</text><circle cx="964.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="958.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Industry</text><text x="958.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Joint doctorates with a</text><text x="958.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">company, such as CIFRE in</text><text x="958.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">France.</text><path d="M78.0 128.0Q176.5 92.0 275.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M184.0 110.0L169.0 114.7L169.0 105.3Z" fill="#4b5563"/><path d="M303.0 128.0Q401.5 92.0 500.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M409.0 110.0L394.0 114.7L394.0 105.3Z" fill="#4b5563"/><path d="M528.0 128.0Q626.5 92.0 725.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M634.0 110.0L619.0 114.7L619.0 105.3Z" fill="#4b5563"/><path d="M753.0 128.0Q851.5 92.0 950.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M859.0 110.0L844.0 114.7L844.0 105.3Z" fill="#4b5563"/></svg>