<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 269" width="1052" height="269" role="img" aria-label="Phases of a doctorate"><title>Phases of a doctorate</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Phases of a doctorate</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Durations vary by country. The order of the phases does not.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Learn</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Key papers, known proofs, a</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">seminar talk, a research</text><text x="58.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">journal.</text><circle cx="309.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="303.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">First result</text><text x="303.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">A well-defined problem written</text><text x="303.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">up as a first preprint.</text><circle cx="554.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="548.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Independence</text><text x="548.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Own questions, conference</text><text x="548.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">talks, thesis plan.</text><circle cx="799.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="793.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Finish</text><text x="793.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Thesis, applications, defence.</text><path d="M78.0 128.0Q186.5 88.8 295.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M194.0 108.4L179.0 113.1L179.0 103.8Z" fill="#4b5563"/><path d="M323.0 128.0Q431.5 88.8 540.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M439.0 108.4L424.0 113.1L424.0 103.8Z" fill="#4b5563"/><path d="M540.0 128.0Q431.5 167.2 323.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M424.0 147.6L439.0 142.9L439.0 152.2Z" fill="#4b5563"/><path d="M568.0 128.0Q676.5 88.8 785.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M684.0 108.4L669.0 113.1L669.0 103.8Z" fill="#4b5563"/></svg>