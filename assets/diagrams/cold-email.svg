<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1222 269" width="1222" height="269" role="img" aria-label="An email to a professor"><title>An email to a professor</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">An email to a professor</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Short, specific, and easy to answer. Under two hundred words.</text><circle cx="64.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="58.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Subject</text><text x="58.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Prospective PhD student:</text><text x="58.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">[topic]. Clear and specific.</text><circle cx="294.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="288.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Who you are</text><text x="288.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">One or two sentences:</text><text x="288.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">degree, university, current</text><text x="288.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">project.</text><circle cx="524.0" cy="128.0" r="6.5" fill="#e07b24"/><text x="518.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Why this person</text><text x="518.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">One paper you actually read</text><text x="518.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">and what interested you in</text><text x="518.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">it.</text><circle cx="754.0" cy="128.0" r="6.5" fill="#2b4fb3"/><text x="748.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">The question</text><text x="748.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Are you taking students?</text><text x="748.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Which funding route would</text><text x="748.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">fit?</text><circle cx="984.0" cy="128.0" r="6.5" fill="#3fa3dd"/><text x="978.0" y="166.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Attachments</text><text x="978.0" y="186.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">CV and transcript as PDF,</text><text x="978.0" y="203.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">with clear file names.</text><path d="M78.0 128.0Q179.0 91.2 280.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M186.5 109.6L171.5 114.2L171.5 104.9Z" fill="#4b5563"/><path d="M308.0 128.0Q409.0 91.2 510.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M416.5 109.6L401.5 114.2L401.5 104.9Z" fill="#4b5563"/><path d="M538.0 128.0Q639.0 91.2 740.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M646.5 109.6L631.5 114.2L631.5 104.9Z" fill="#4b5563"/><path d="M768.0 128.0Q869.0 91.2 970.0 128.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M876.5 109.6L861.5 114.2L861.5 104.9Z" fill="#4b5563"/></svg>