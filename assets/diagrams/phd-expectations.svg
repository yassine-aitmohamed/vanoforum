<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640" role="img" aria-label="Who brings what to a PhD"><title>Who brings what to a PhD</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">Who brings what to a PhD</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">The supervisor supports. The student owns the project and brings the drive.</text><path d="M522.8 195.6Q677.5 195.1 782.5 308.8" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M672.0 226.7L656.4 224.9L660.1 216.4Z" fill="#4b5563"/><path d="M788.7 326.7Q781.1 436.8 693.0 503.3" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M757.4 432.5L760.4 417.1L768.6 421.5Z" fill="#4b5563"/><path d="M672.3 515.6Q510.0 579.1 347.7 515.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M502.5 547.4L517.5 542.7L517.5 552.0Z" fill="#4b5563"/><path d="M347.7 515.6Q510.0 452.1 672.3 515.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M517.5 483.9L502.5 488.5L502.5 479.2Z" fill="#4b5563"/><path d="M327.0 503.3Q238.9 436.8 231.3 326.7" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M255.5 419.3L266.7 430.3L258.5 434.7Z" fill="#4b5563"/><path d="M237.5 308.8Q342.5 195.1 497.2 195.6" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M361.8 220.7L349.9 230.9L346.2 222.4Z" fill="#4b5563"/><circle cx="510.0" cy="190.0" r="6.5" fill="#2b4fb3"/><text x="510.0" y="110.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Questions</text><text x="510.0" y="130.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Bring them to every</text><text x="510.0" y="147.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">meeting, with or without</text><text x="510.0" y="164.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">results.</text><circle cx="795.3" cy="314.4" r="6.5" fill="#3fa3dd"/><text x="817.3" y="319.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Should do?</text><text x="817.3" y="339.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Ask what a problem is</text><text x="817.3" y="356.4" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">worth before solving it.</text><circle cx="686.3" cy="515.6" r="6.5" fill="#e07b24"/><text x="708.3" y="520.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Feedback</text><text x="708.3" y="540.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Expose ideas early and let</text><text x="708.3" y="557.6" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">the weak ones go.</text><circle cx="333.7" cy="515.6" r="6.5" fill="#2b4fb3"/><text x="311.7" y="520.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Vision</text><text x="311.7" y="540.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">From the supervisor: where</text><text x="311.7" y="557.6" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">the project fits.</text><circle cx="224.7" cy="314.4" r="6.5" fill="#3fa3dd"/><text x="202.7" y="319.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Ownership</text><text x="202.7" y="339.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Answer every question</text><text x="202.7" y="356.4" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">about your project.</text></svg>