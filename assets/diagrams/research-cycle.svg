<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="1060" height="680" role="img" aria-label="A research cycle"><title>A research cycle</title><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="46" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937">A research cycle</text><text x="36" y="71" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#6b7280">Most ideas fail. A method makes them fail early and cheaply. Examples and strategy go back and forth.</text><path d="M543.2 194.8Q688.6 184.6 794.0 285.2" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M685.6 214.8L669.9 214.1L673.1 205.4Z" fill="#4b5563"/><path d="M807.1 304.0Q843.1 390.0 807.1 476.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M825.1 397.5L820.5 382.5L829.8 382.5Z" fill="#4b5563"/><path d="M807.1 476.0Q771.1 390.0 807.1 304.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M789.1 382.5L793.8 397.5L784.5 397.5Z" fill="#4b5563"/><path d="M794.0 494.8Q688.6 595.4 543.2 585.2" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M671.5 570.3L684.0 560.8L687.2 569.5Z" fill="#4b5563"/><path d="M516.8 585.2Q371.4 595.4 266.0 494.8" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M374.4 565.2L390.1 565.9L386.9 574.6Z" fill="#4b5563"/><path d="M252.9 476.0Q212.9 390.0 252.9 304.0" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M232.9 382.5L237.5 397.5L228.2 397.5Z" fill="#4b5563"/><path d="M266.0 285.2Q371.4 184.6 516.8 194.8" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M388.5 209.7L376.0 219.2L372.8 210.5Z" fill="#4b5563"/><circle cx="530.0" cy="190.0" r="6.5" fill="#2b4fb3"/><text x="530.0" y="127.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Problem</text><text x="530.0" y="147.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">One precise sentence, from</text><text x="530.0" y="164.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">an open question or a gap.</text><circle cx="807.1" cy="290.0" r="6.5" fill="#3fa3dd"/><text x="829.1" y="295.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Examples</text><text x="829.1" y="315.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Smallest cases by hand.</text><text x="829.1" y="332.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Look for counterexamples.</text><circle cx="807.1" cy="490.0" r="6.5" fill="#e07b24"/><text x="829.1" y="495.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Strategy</text><text x="829.1" y="515.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Half a page, discussed</text><text x="829.1" y="532.0" text-anchor="start" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">before any formal proof.</text><circle cx="530.0" cy="590.0" r="6.5" fill="#2b4fb3"/><text x="530.0" y="620.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2b4fb3">Originality</text><text x="530.0" y="640.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Does a statement of this</text><text x="530.0" y="657.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">form exist? Keep it</text><text x="530.0" y="674.0" text-anchor="middle" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">separate from difficulty.</text><circle cx="252.9" cy="490.0" r="6.5" fill="#3fa3dd"/><text x="230.9" y="495.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fa3dd">Write</text><text x="230.9" y="515.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Results first,</text><text x="230.9" y="532.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">introduction and abstract</text><text x="230.9" y="549.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">last.</text><circle cx="252.9" cy="290.0" r="6.5" fill="#e07b24"/><text x="230.9" y="295.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#e07b24">Preprint</text><text x="230.9" y="315.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">Post, submit, start the</text><text x="230.9" y="332.0" text-anchor="end" font-family="IBM Plex Sans, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6b7280">next project.</text></svg>